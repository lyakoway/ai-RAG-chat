# Render Blueprint — деплой AI RAG Chat одним сервисом.
# Бэкенд (FastAPI) отдаёт и API, и собранный фронтенд с одного домена,
# поэтому на free-тарифе не нужна межсервисная сеть и нет проблем с CORS.
# Инструкция: Render Dashboard → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: ai-rag-chat-backend
    runtime: docker
    # Комбинированный образ из корня репозитория (фронт + бэкенд).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Бесплатный тариф: без persistent-диска → данные (ChromaDB, загрузки,
    # SQLite) эфемерны и стираются при рестарте/редеплое. Нужна
    # персистентность → plan: starter + блок disk (mountPath /app/data).
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Ключи задаются в дашборде Render (sync: false — не хранятся в git).
      # Без них приложение работает в демо-режиме (mock) + локальные эмбеддинги.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
