services:
  backend:
    build: ./backend
    environment:
      # Раскомментируйте и задайте ключи для реальных моделей:
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - backend_data:/app/data          # uploads + chroma + sqlite
      - fastembed_cache:/root/.cache    # локальная модель эмбеддингов (кэш)
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ к локальному Ollama

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  backend_data:
  fastembed_cache:
